services:
  shortener-db:
    image: postgres:14-alpine
    container_name: shortener-db-ct
    volumes:
      - postgres_home:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=shortener
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d shortener" ]
      interval: 10s
      timeout: 2s
      retries: 2

  server:
    build:
      context: .
      dockerfile: cmd/shortener/Dockerfile
    container_name: shortener-server-ct
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SERVER_ADDRESS=:8080
      - SERVER_ADDRESS_GRPC=:8081
      - DATABASE_DSN=postgres://root:root@shortener-db:5432/shortener?sslmode=disable
      - FILE_STORAGE_PATH=storage/urls.json
      - LOG_LEVEL=info
      - ENABLE_HTTPS=false
    depends_on:
      shortener-db:
        condition: service_healthy

volumes:
  postgres_home: